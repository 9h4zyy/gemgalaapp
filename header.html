<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Gemgala Header</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- COPY FROM HERE TO ELEMENTOR -->
    <header class="nav-wrap">
        <nav class="navbar" aria-label="Main navigation">
            <a class="brand" href="#home">
                <span class="brand-badge">
                    <img src="http://gemgalaapp.com/wp-content/uploads/2026/09/gemgala-icon.jpg" alt=" Gemgala Logo"
                        class="brand-logo">
                </span>
                Gemgala
            </a>
            <div class="nav-links" id="navLinks">
                <a href="#download">Download</a>
                <a href="#register">Register</a>
                <a href="#host-agent">Host & Agent</a>
                <a href="#withdraw">Withdrawal</a>
                <a href="#faqs">FAQs</a>
                <a class="glass primary nav-cta-mobile" href="https://getblock.me/u/28002073" target="_blank"
                    rel="noopener">
                    Get the app <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <path d="M7 17L17 7M17 7H7M17 7V17" />
                    </svg>
                </a>
            </div>
            <div class="nav-actions">
                <a class="glass primary small" href="https://getblock.me/u/28002073" target="_blank" rel="noopener">
                    Get the app <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <path d="M7 17L17 7M17 7H7M17 7V17" />
                    </svg>
                </a>
                <button class="menu" id="menuToggle" aria-label="Open menu" aria-expanded="false">
                    <svg class="icon-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round">
                        <line x1="3" y1="6" x2="21" y2="6" class="menu-line line-top"></line>
                        <line x1="3" y1="12" x2="21" y2="12" class="menu-line line-mid"></line>
                        <line x1="3" y1="18" x2="21" y2="18" class="menu-line line-bot"></line>
                    </svg>
                </button>
            </div>
        </nav>
    </header>
    <script>
        const toggle = document.getElementById('menuToggle');
        const nav = document.getElementById('navLinks');
        const navbar = document.querySelector('.navbar');

        function setMenuOpen(open) {
            nav.classList.toggle('open', open);
            toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
            toggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
        }

        toggle.addEventListener('click', (e) => {
            e.stopPropagation();
            setMenuOpen(!nav.classList.contains('open'));
        });

        nav.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
            setMenuOpen(false);
        }));

        document.addEventListener('click', (e) => {
            if (nav.classList.contains('open') && !navbar.contains(e.target)) {
                setMenuOpen(false);
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && nav.classList.contains('open')) {
                setMenuOpen(false);
            }
        });
    </script>
    <!-- END COPY -->
</body>

</html>
